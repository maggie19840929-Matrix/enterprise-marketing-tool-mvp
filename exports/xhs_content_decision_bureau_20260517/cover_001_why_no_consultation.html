<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>内容决策局首发封面</title>
<style>
  html, body { margin:0; padding:0; background:#eee; }
  .canvas{
    width:1242px; height:1660px; position:relative; overflow:hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg,#fff7f2 0%,#fff2e9 55%,#fffaf5 100%);
    color:#292523;
  }
  .blob{position:absolute;border-radius:50%;filter:blur(20px);opacity:.8}
  .b1{width:680px;height:680px;left:-220px;top:-160px;background:#ffd7ce}.b2{width:640px;height:640px;right:-260px;top:40px;background:#e7f0ff}.b3{width:680px;height:680px;right:-260px;bottom:-120px;background:#dff8ea}
  .badge{position:absolute;left:92px;top:92px;background:#292523;color:#fff;border-radius:34px;padding:18px 34px;font-size:32px;letter-spacing:1px}
  h1{position:absolute;left:92px;top:250px;margin:0;font-size:86px;line-height:1.18;font-weight:800;letter-spacing:-2px;}
  .underline{position:absolute;left:92px;top:618px;width:452px;height:22px;background:#ff695d;border-radius:15px;}
  .card{position:absolute;left:92px;width:1058px;height:155px;background:rgba(255,255,255,.9);border:2px solid #f0d8d0;border-radius:34px;box-shadow:0 18px 50px rgba(74,41,31,.07)}
  .c1{top:735px}.c2{top:925px}.c3{top:1115px}
  .num{position:absolute;left:34px;top:46px;width:62px;height:62px;border-radius:50%;background:#ff695d;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .card b{position:absolute;left:128px;top:30px;font-size:48px}.card span{position:absolute;left:128px;top:93px;font-size:32px;color:#666}
  .cta{position:absolute;left:92px;top:1365px;width:1058px;height:153px;background:#292523;border-radius:38px;color:#fff;box-shadow:0 22px 60px rgba(41,37,35,.2)}
  .cta .small{position:absolute;left:38px;top:29px;font-size:34px;color:#fff}.cta .big{position:absolute;left:38px;top:82px;font-size:42px;font-weight:650;color:#fff}
  .foot{position:absolute;left:92px;bottom:54px;font-size:31px;color:#6d6d6d}
</style>
</head>
<body>
<div class="canvas">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="badge">内容决策局 · 001</div>
  <h1>发了很多内容，<br>为什么还是<br>没人咨询？</h1>
  <div class="underline"></div>
  <div class="card c1"><div class="num">1</div><b>不是内容不够多</b><span>而是没有对准“会咨询的人”</span></div>
  <div class="card c2"><div class="num">2</div><b>不是AI写得不够快</b><span>而是没人看见你的真实价值</span></div>
  <div class="card c3"><div class="num">3</div><b>不是点赞越多越好</b><span>而是要能留下问题和线索</span></div>
  <div class="cta"><div class="small">今天先做一个判断：</div><div class="big">这条内容能不能带来“咨询动作”？</div></div>
  <div class="foot">用AI做选题、复盘和增长实验｜不只追爆款，更看咨询和转化</div>
</div>
</body></html>
