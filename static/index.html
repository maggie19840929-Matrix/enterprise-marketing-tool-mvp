<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企业营销增长工作台 v1.5.5</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">v1.5.5 · 状态分层与按钮精简版</p>
      <h1>企业营销增长驾驶舱</h1>
      
    </div>
    <div class="hero-actions clean-actions">
      <button type="button" onclick="document.querySelector('#diagnosisWorkflow')?.scrollIntoView({behavior:'smooth'})">诊断</button>
      <button id="sampleBtn" class="secondary" type="button">样例</button>
      <details class="more-actions">
        <summary>更多</summary>
        <div class="more-actions-menu">
          <button class="secondary" type="button" onclick="downloadDataBackup()">导出</button>
          <label class="secondary import-btn">导入<input id="importFile" type="file" accept="application/json" hidden onchange="importDataBackup(this.files[0]); this.value=''" /></label>
          <button id="refreshBtn" class="secondary danger-action" type="button">清空</button>
        </div>
      </details>
    </div>
  </header>

  <main>
    <section class="panel workbench-panel" id="lifecycleWorkbench"></section>

    <section class="cards metric-section" id="metricCards" hidden></section>

    <section class="grid cockpit" id="diagnosisWorkflow">
      <article class="panel intake-panel">
        <div class="panel-head compact-head">
          <div>
            <h2>增长诊断</h2>
            
          </div>
        </div>
        <form id="assessmentForm" class="assessment-form compact-form">
          <div class="form-section-title wide-field">模块 A｜快速了解你的业务</div>
          <label>你是做什么的？<input name="industry" required placeholder="例如：口腔门诊 / 美容美甲门店 / 教育培训 / 餐饮门店" /></label>
          <label>你想通过内容获得什么结果？<input name="main_goal" required placeholder="例如：获得更多咨询 / 到店预约 / 课程报名" /></label>
          <label>你的目标客户是谁？<input name="target_customer" placeholder="例如：本地宝妈、家庭客户、商家、门店负责人" /></label>
          <label>你现在主要发在哪个平台？<input name="current_channels" required placeholder="例如：小红书 / 抖音 / 视频号 / 朋友圈 / 美团" /></label>
          <label>当前最大问题是什么？
            <select name="biggest_problem" required>
              <option>不知道发什么</option>
              <option>没流量</option>
              <option>没咨询</option>
              <option>发完没人复盘</option>
            </select>
          </label>
          <div class="benchmark-block wide-field">
            <h3>对标账号参考｜避免 AI 凭空编爆款</h3>
            <p class="hint">对标账号不是用来抄袭，而是用来判断市场已经验证过的痛点、标题结构和用户需求。</p>
            <div class="advanced-grid">
              <label>对标平台
                <select name="benchmark_platform">
                  <option>小红书</option>
                  <option>抖音</option>
                  <option>视频号</option>
                  <option>其他</option>
                </select>
              </label>
              <label>对标账号链接或名称<textarea name="benchmark_accounts" placeholder="可填 1-3 个，用换行或逗号分隔"></textarea></label>
              <label class="wide-field">你觉得它哪条内容不错？<textarea name="benchmark_sample_content" placeholder="可选：标题、链接、数据摘要；只做主题参考，不照抄原文"></textarea></label>
              <label class="wide-field">你想参考它什么？<textarea name="benchmark_notes" placeholder="可选：例如痛点表达、标题结构、信任证据、收藏高的主题"></textarea></label>
            </div>
          </div>
          <input type="hidden" name="posting_frequency" value="偶尔发布" />
          <details class="advanced-fields">
            <summary>高级补充，可不填</summary>
            <div class="advanced-grid">
              <label>企业名称<input name="company_name" placeholder="可选" /></label>
              <label>联系人<input name="contact" placeholder="可选" /></label>
              <label>发布频率
                <select name="posting_frequency_detail">
                  <option>偶尔发布</option>
                  <option>每周1条</option>
                  <option>每周3条</option>
                  <option>每天稳定发布</option>
                </select>
              </label>
              <label>产品/服务入口<input name="offer" placeholder="例如：预约检查 / 到店体验 / 课程试听 / 方案评估" /></label>
              <label>现有内容资产<input name="content_assets" placeholder="客户案例、门店照片、服务过程、FAQ" /></label>
              <label>月预算<input name="monthly_budget" placeholder="例如3000元以内" /></label>
              <label>决策周期<input name="decision_cycle" placeholder="例如1周/1个月" /></label>
              <label>最近效果最好的内容<input name="best_recent_content" placeholder="客户案例、产品演示、老板出镜..." /></label>
              <label>账号定位/昵称倾向<input name="account_preference" placeholder="例如内容决策局 / 企业获客复盘号" /></label>
              <label class="wide-field">客户核心痛点<textarea name="customer_pain" placeholder="客户为什么会需要你？现在最困扰他的是什么？"></textarea></label>
            </div>
          </details>
          <button type="submit">生成内容增长建议</button>
        </form>
      </article>

      <article class="panel highlight diagnosis-panel diagnosis-evidence-panel">
        <h2>诊断报告</h2>
        <div id="latestDiagnosis" class="empty">提交后生成诊断报告。</div>
      </article>
    </section>

    <details id="clientEvidencePanel" class="panel client-snapshot-panel compact-client-panel collapsible-panel">
      <summary>客户输入</summary>
      
      <div id="clientSnapshot" class="empty">暂无客户数据，先提交一次营销体检。</div>
    </details>

    <section class="panel compact-plan-panel" id="planSection" hidden>
      <div class="panel-head">
        <h2>7天内容发布计划</h2>
        
      </div>
      <div id="plansSummary" class="plan-summary empty">生成诊断后显示前三个优先动作。</div>
      <details class="table-details">
        <summary>展开完整7天计划表</summary>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID/日期</th><th>平台</th><th>内容主题</th><th>角度</th><th>形式</th><th>合规承接</th><th>目标</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="plansBody"></tbody>
          </table>
        </div>
      </details>
    </section>

    <section class="panel" id="feedbackHint">
      <h2>回填</h2>
      
    </section>

    <section class="grid two feedback-focus" id="feedbackWorkflow" hidden>
      <article class="panel">
        <h2>回填</h2>
        
        <form id="feedbackForm">
          <label>发布计划ID<input name="content_plan_id" required type="number" placeholder="从发布计划表中选择 ID" /></label>
          <label>发布链接<input name="publish_link" required type="url" placeholder="粘贴已发布内容链接" /></label>
          <label>反馈时间点
            <select name="feedback_stage" required>
              <option value="T+24">T+24｜发布后24小时</option>
              <option value="T+72">T+72｜发布后72小时</option>
              <option value="T+7">T+7｜发布后7天</option>
            </select>
          </label>
          <div class="mini-grid">
            <label>曝光/播放<input name="views" type="number" value="0" /></label>
            <label>点赞<input name="likes" type="number" value="0" /></label>
            <label>评论<input name="comments" type="number" value="0" /></label>
            <label>收藏<input name="favorites" type="number" value="0" /></label>
            <label>转发<input name="shares" type="number" value="0" /></label>
            <label>私信/咨询<input name="consultations" type="number" value="0" /></label>
          </div>
          <label>备注<textarea name="notes" placeholder="例如：有客户问价格 / 私信问资料 / 开头被吐槽"></textarea></label>
          <button type="submit">保存</button>
        </form>
      </article>

      <article class="panel">
        <div class="panel-head">
          <h2>周复盘</h2>
          <button id="reviewBtn" class="secondary">更新</button>
        </div>
        <div id="reviewBox" class="empty">保存反馈后，系统会自动生成周复盘。</div>
        <h3>记录</h3>
        <div id="feedbackList" class="list"></div>
      </article>
    </section>
  </main>

  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
